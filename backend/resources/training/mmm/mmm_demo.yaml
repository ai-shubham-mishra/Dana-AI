# MMM Model Training Configuration
# Update this file to adjust model parameters without changing code

model:
  # Model name (auto-generated if null: mmm_{country}_{timestamp})
  name: demo
  
  # Adstock settings
  adstock:
    l_max: 10 
  
  # Seasonality
  time_varying_intercept: true
  yearly_seasonality: 2
  
  # Priors
  priors:
    intercept:
      distribution: "HalfNormal"
      sigma: 0.5
    
    saturation_beta:
      distribution: "HalfNormal"
      # sigma calculated from spend share
    
    saturation_lam:
      distribution: "Gamma"
      alpha: 3
      beta: 1
    
    adstock_alpha:
      distribution: "Beta"
      alpha: 1
      beta: 3
    
    gamma_control:
      distribution: "TruncatedNormal"
      mu: 0
      sigma: 0.05
      lower: 0
    
    gamma_fourier:
      distribution: "Laplace"
      mu: 0
      b: 0.1
    
    likelihood:
      distribution: "TruncatedNormal"
      lower: 0
      sigma:
        distribution: "HalfNormal"
        sigma: 0.25

# Sampling configuration
sampling:
  chains: 4
  tune: 2000
  target_accept: 0.95
  random_seed: 123
  progressbar: true

# Channel definitions (order matters for spend share calculation)
channels:
  - "Google-Demand-Gen"
  - "Google-PMax"
  - "Google-Search"
  - "YouTube"
  - "Meta-ASC"
  - "Meta-Reach"
  - "Meta-Performance"
  - "Microsoft"
  - "Pinterest"
  - "TV"

# Control variables
controls:
  - "black_friday"
  - "weather_data"
  - "brand_query_volume"

# Date column name
date_column: "date"

# Target column name
target_column: "sales"
